    pvpArea1:
      world: "world"
      from:
        x: -150
        y: -64
        z: -150
      to:
        x: 150
        y: -10
        z: 150
    pvpArea2:
      world: "world_nether"
      from:
        x: -150
        y: 50
        z: -150
      to:
        x: 150
        y: 0
        z: 150
